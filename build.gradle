plugins {
    id 'fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "villagepax" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        gametest {
            server()
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
            runDir "build/gametest"
        }
    }
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Wisp Forest'
        url = 'https://maven.wispforest.io/releases/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        // Фильтр по группам, а не «искать тут всё»: иначе Gradle ходит
        // на чужой склад за каждой зависимостью мода. Групп две —
        // сама библиотека и mclib, её собственная зависимость, которой
        // нет ни в центральном, ни у blamejared.
        content {
            includeGroup('software.bernie.geckolib')
            includeGroup('com.eliotlash.mclib')
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // owo-lib — зависимость времени исполнения, а не jar-in-jar: так советует
    // сама библиотека, и две её копии в одной сборке стоят дороже одного
    // пункта в списке установки.
    //
    // owo-sentinel (окно «поставь библиотеку» вместо стека вызовов) не
    // вкладывается: под 1.20.1 у него нет выпуска, только предрелизы, а
    // загрузчик Fabric и без него показывает внятный экран по depends.
    modImplementation "io.wispforest:owo-lib:${project.owo_version}"

    // GeckoLib — тем же порядком, что и owo: зависимость времени исполнения,
    // а не jar-in-jar. Библиотека общая, её ставят десятки модов, и вторая
    // копия в сборке стоит дороже одного пункта в списке установки.
    modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

    // mclib — разборщик molang внутри GeckoLib. Сама библиотека объявляет
    // его зависимостью времени исполнения, но свои переменные шага мы
    // заводим через её парсер, а он наследник класса из mclib: без этой
    // строки компилятор не видит предка. Только для сборки — в игре
    // mclib уже лежит внутри GeckoLib.
    compileOnly "com.eliotlash.mclib:mclib:${project.mclib_version}"
    // И в проверках: CitizenMolangTest разбирает выражения движений тем же
    // разборщиком, что игра, — а ему mclib нужен и при сборке, и в работе.
    testImplementation "com.eliotlash.mclib:mclib:${project.mclib_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Свойства вместо примеров там, где важен весь домен входов,
    // а не одна рукописная выборка: круговой прогон сохранения.
    testImplementation 'net.jqwik:jqwik:1.10.1'
}

// Мир игровых проверок не переживает прогон.
//
// Он лежит в build/gametest и по умолчанию остаётся от запуска к запуску
// вместе со всем, что в нём насохраняли поселения. Проверка, упавшая
// и не убравшая за собой место, роняла следующий прогон уже на другом
// тесте — и виноватым выглядел кто угодно, кроме настоящей причины.
// Поймано вживую дважды.
tasks.matching { it.name == 'runGametest' }.configureEach {
    doFirst {
        delete("${project.layout.buildDirectory.get()}/gametest/world")
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
