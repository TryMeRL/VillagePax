# Демону Gradle память задаём явно: в системе выставлена глобальная
# _JAVA_OPTIONS=-Xmx16G, и без этой строки демон резервирует 16 ГБ.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# JDK 17 стоит локально, но не на PATH — подсказываем Gradle, где искать
org.gradle.java.installations.paths=C:\\Program Files\\Java\\jdk-17

minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.5

mod_version=0.1.0-SNAPSHOT
maven_group=com.villagepax
archives_base_name=villagepax

fabric_version=0.92.12+1.20.1

# owo-lib: вёрстка экранов и синхронизация данных с сервера.
# 0.11.2+1.20 — последняя версия под 1.20.1; библиотека ушла на 1.21,
# а цель мода заморожена на 1.20.1, так что это не долг, а конец ветки.
owo_version=0.11.2+1.20
